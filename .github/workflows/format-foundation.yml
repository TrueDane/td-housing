name: Format Foundation

on:
  push:
    branches:
      - 'feature/td-housing-foundation'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Format migrated Lua
        uses: JohnnyMorganz/stylua-action@v4
        with:
          version: latest
          token: ${{ secrets.GITHUB_TOKEN }}
          args: >-
            fxmanifest.lua
            config/shared.lua
            config/client.lua
            shared/property_capabilities.lua
            server/legacy_registration_guard.lua
            server/legacy_registration_restore.lua
            server/repositories/property_repository.lua
            server/services/property_capability_service.lua
            server/services/legacy_guard_service.lua
            server/modules/property_capabilities.lua
            server/modules/legacy_compatibility.lua
            client/integrations/wardrobe.lua
            client/modules/property_capabilities.lua
            tests/property_capabilities.lua

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fxmanifest.lua config shared/property_capabilities.lua server client tests/property_capabilities.lua
          git commit -m "style: format housing foundation"
          git push
